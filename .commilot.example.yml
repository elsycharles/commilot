# Commilot's own configuration — Commilot uses itself for its commits.
#
# This is the TEMPLATE, and the only one tracked by git. Copy it before use:
#     cp .commilot.example.yml .commilot.yml
# .commilot.yml is gitignored, so a key put there can never be committed.
# Better still, leave apiKey empty and export COMMILOT_GEMINI_KEY.

provider: gemini

gemini:
  apiKey: ""
  model: gemini-2.0-flash
  temperature: 0.3

format:
  template: "{type}({scope}) - {description}"
  types:
    - dev
    - feat
    - bug
  scopes:
    - cli
    - config
    - git
    - diff
    - provider
    - prompt
    - parser
    - ui
    - hook
    - tests
    - docs
    - build
  descriptionMaxLength: 72
  language: en

behaviour:
  autoStage: false
  maxDiffLines: 5000
  excludePatterns:
    - "package-lock.json"
    - "yarn.lock"
    - "*.min.js"
    - "*.min.css"
    - "dist/**"
    - "coverage/**"
  splitMaxCommits: 10
  confirmBeforeCommit: true
