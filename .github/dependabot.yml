version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the whole dev toolchain instead of a dozen.
      dev-dependencies:
        dependency-type: development
    ignore:
      # Each of these was tried and rejected with evidence; see CONTRIBUTING.
      # Without these rules Dependabot reopens the same pull request weekly.

      # typescript-eslint refuses TS 7 ("does not support TS 7.0") and tsup's
      # declaration build crashes on it. Lift when typescript-eslint supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

      # execa 10 requires Node >=22 and dies on Node 20, which engines.node
      # still supports. Lift together with engines.node.
      - dependency-name: execa
        update-types: [version-update:semver-major]

      # @types/node must track the oldest supported Node, not the newest.
      # Lift together with engines.node.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
